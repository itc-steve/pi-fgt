<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">pi-fgt response filtering proof</title>
  <desc id="desc">Measured token reduction on a live FGT70F: 434KB raw down to 45KB filtered (90%). Five common tools shown with cut percentages.</desc>

  <rect width="1200" height="300" rx="26" fill="#0a0c0f"/>
  <path d="M0 52H1200" stroke="#1e2228"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="56" y="36" fill="#8a9099" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" letter-spacing="2.2">PROOF  ·  LIVE FGT70F  ·  v7.4.12  ·  DEFAULTS</text>

    <text x="56" y="110" fill="#f4f1ea" font-size="56" font-weight="700" letter-spacing="-1.6">434 KB → 45 KB</text>
    <text x="56" y="150" fill="#3ecf8e" font-size="28" font-weight="600">90% cut across 8 common tools</text>
    <text x="56" y="186" fill="#8a9099" font-size="18">Configurable field filters. Verbose still returns raw when you ask.</text>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#c5c9d0">
    <rect x="56" y="214" width="208" height="48" rx="10" fill="#11151b" stroke="#2a2f38"/>
    <text x="72" y="244">interfaces  98%</text>

    <rect x="280" y="214" width="208" height="48" rx="10" fill="#11151b" stroke="#2a2f38"/>
    <text x="296" y="244">policies  93%</text>

    <rect x="504" y="214" width="208" height="48" rx="10" fill="#11151b" stroke="#2a2f38"/>
    <text x="520" y="244">addresses  89%</text>

    <rect x="728" y="214" width="188" height="48" rx="10" fill="#11151b" stroke="#2a2f38"/>
    <text x="744" y="244">fortiaps  82%</text>

    <rect x="932" y="214" width="212" height="48" rx="10" fill="#11151b" stroke="#2a2f38"/>
    <text x="948" y="244">sessions  55%</text>
  </g>
</svg>
