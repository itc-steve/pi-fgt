<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">How pi-fgt exposes a FortiGate</title>
  <desc id="desc">Four-step flow: install extension, configure devices and tokens, pick devices for this session, then issue GET-only tool calls.</desc>

  <rect width="1200" height="280" rx="26" fill="#0a0c0f"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="56" y="48" fill="#8a9099" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" letter-spacing="2.2">SESSION FLOW</text>
    <text x="56" y="86" fill="#f4f1ea" font-size="28" font-weight="650">Config exists. Exposure is chosen every session.</text>
  </g>

  <!-- four steps -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">
    <!-- 1 -->
    <rect x="56" y="120" width="240" height="112" rx="14" fill="#11151b" stroke="#2a2f38"/>
    <text x="76" y="152" fill="#3ecf8e" font-size="13">01</text>
    <text x="76" y="180" fill="#f4f1ea" font-size="18" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="600">Install</text>
    <text x="76" y="208" fill="#8a9099" font-size="14">pi install · /reload</text>

    <path d="M308 176H340" stroke="#2a2f38" stroke-width="1.5"/>
    <path d="M332 168l10 8-10 8" fill="none" stroke="#5c636e" stroke-width="1.5"/>

    <!-- 2 -->
    <rect x="352" y="120" width="240" height="112" rx="14" fill="#11151b" stroke="#2a2f38"/>
    <text x="372" y="152" fill="#3ecf8e" font-size="13">02</text>
    <text x="372" y="180" fill="#f4f1ea" font-size="18" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="600">Configure</text>
    <text x="372" y="208" fill="#8a9099" font-size="14">json + env + filters</text>

    <path d="M604 176H636" stroke="#2a2f38" stroke-width="1.5"/>
    <path d="M628 168l10 8-10 8" fill="none" stroke="#5c636e" stroke-width="1.5"/>

    <!-- 3 -->
    <rect x="648" y="120" width="240" height="112" rx="14" fill="#11151b" stroke="#2a2f38"/>
    <text x="668" y="152" fill="#3ecf8e" font-size="13">03</text>
    <text x="668" y="180" fill="#f4f1ea" font-size="18" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="600">Pick devices</text>
    <text x="668" y="208" fill="#8a9099" font-size="14">/fortigate · in-memory</text>

    <path d="M900 176H932" stroke="#2a2f38" stroke-width="1.5"/>
    <path d="M924 168l10 8-10 8" fill="none" stroke="#5c636e" stroke-width="1.5"/>

    <!-- 4 -->
    <rect x="944" y="120" width="200" height="112" rx="14" fill="#11151b" stroke="#3ecf8e" stroke-opacity="0.55"/>
    <text x="964" y="152" fill="#3ecf8e" font-size="13">04</text>
    <text x="964" y="180" fill="#f4f1ea" font-size="18" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="600">Query</text>
    <text x="964" y="208" fill="#8a9099" font-size="14">GET tools only</text>
  </g>
</svg>
